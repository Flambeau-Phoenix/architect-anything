name: Bug report
description: Something in the skill, CLI, MCP server or reports does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** attach private source, credentials or raw
        evidence. For security problems use the private advisory form instead
        (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or prompt, what you expected, and what you got. Include the JSON error if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproducer
      description: Steps or a tiny shareable target that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Architect Anything version
      description: Output of `architect-anything --version` or `python .../scripts/aa_cli.py --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, Antigravity, Other MCP/skill host, CLI only]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python and OS
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
  - type: input
    id: rea
    attributes:
      label: REA version and provider (finished products only)
      placeholder: REA 6.7.0, Ghidra 12.1.4
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private paths, credentials and customer data from what I pasted
          required: true
