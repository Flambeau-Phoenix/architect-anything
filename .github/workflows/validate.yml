name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check release structure
        run: python scripts/check_release.py
      - name: Install agent CLI
        run: python -m pip install .
      - name: Check installed entry points
        run: |
          architect-anything --version
          python -m architect_anything --help
          python scripts/smoke_installed_cli.py
      - name: Run behavioral tests
        run: python -m unittest discover -s architect-anything/tests -v
      - name: Generate and validate demo
        run: python scripts/generate_demo.py --output .demo
      - name: Generate focused explanation
        run: python scripts/generate_focus_demo.py --output .cli-demo
      - name: Build portable archive
        run: python scripts/build_release.py
