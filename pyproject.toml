[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "architect-anything"
dynamic = ["version"]
description = "Evidence-backed architecture investigations for source projects and finished products."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
architect-anything = "architect_anything:main"
architect-anything-mcp = "architect_anything:mcp_main"

[tool.setuptools]
packages = ["architect_anything"]
package-dir = {architect_anything = "architect-anything"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "architect_anything.__version__"}

[tool.setuptools.package-data]
architect_anything = [
  "SKILL.md", "LICENSE", "agents/*.yaml", "assets/*", "references/*.md",
  "examples/*.json", "scripts/*.py", "tests/*.py"
]
